<html>
    <head>
        <title>Home</title>
        <style>
          {
            box-sizing:border-box;
          }
            body{
                min-height: 100vh;
                background:linear-gradient(135deg,#141e30,#243b55);
                display: flex;
                justify-content: center;
                align-items: center;
                color:white;
                margin:0;
            }
            .container{
                width:90%;
                max-width: 900px;
                padding:45px;
                text-align:center;

                background:rgba(255,255,255,0.10);
                border:1px solid rgba(255,255,255,0.2);
                border-radius: 25px;

                backdrop-filter: blur(15px);
                box-shadow:0 15px 440px rgba(0,0,0,0.4);
            }
           h1{
            font-size: 40px;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.4);
           }
           p{
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 30px;
            color:#c3ebb1;
           }
           .logout-btn{
            margin-bottom: 30px;
           }
           .logout-btn a{
            display: inline-block;
            padding:12px 25px;
            background:#3f3333;
            color:white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255,71,87,0.4);
           }
           nav ul{
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap:15px;
           }
           nav ul li a{
            display: block;
            padding: 14px 22px;
            color:white;
            text-decoration: none;
            background:rgba(255,255,255,0.12);
            border:1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            transition: 0.3s;
           }
           nav ul li a:hover{
            background: white;
            color:#243b55;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255,255,255,0.2);
           }
           nav i{
            margin-right: 8px;
           } 
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Welcome to Arnel's Page</h1>
            <p>Accept the truth that the world is so unfair.<br>keep trying,keep believing,and
                keep moving forward.<br>To make your Dream happened</p>

                    <a href="Login Form.html"><i class="fas fa-sign-out-alt"></i>Logout</a>
                </div>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html"><i class="fas fa-home"></i>Home</a></li>

                         <li><a href="Contact.html"><i class="fas fa-envelope"></i>Contact</a></li>
                          <li><a href="Product.html"><i class="fas fa-box"></i>Product</a></li>
                    </ul>
                </nav>
                </body>
                </html>
